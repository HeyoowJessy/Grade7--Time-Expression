<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Expressions Interactive Lesson</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Trebuchet MS',sans-serif}
body{
  background:#7ec8ff;
  overflow:hidden;
}
.container{display:flex;height:100vh}
.sidebar{
  width:220px;background:#ffcc00;padding:18px;display:flex;flex-direction:column;gap:12px;
  border-right:6px solid #b56b00;
}
.sidebar button{
  padding:14px;border:4px solid #7a3f00;border-radius:12px;background:#fff3b0;
  font-size:16px;font-weight:bold;cursor:pointer;
}
.sidebar button:hover{background:#fff;transform:scale(1.03)}
.content{
  flex:1;overflow-y:auto;padding:22px;
  background:
  linear-gradient(#6ec6ff 0 65%, #7bd957 65% 100%);
}
.section{display:none}
.active{display:block}
.cover{
  width:100%;height:93vh;border-radius:20px;
  background:url('ChatGPT Image May 14, 2026, 01_06_09 PM.png') center/cover no-repeat;
  position:relative;
}
.cover-text{
  position:absolute;
  left:50%;
  top:25px;
  transform:translateX(-50%);
  text-align:center;
  width:88%;
  padding:22px 28px;
  border-radius:28px;
  background:rgba(255,244,184,.88);
  border:7px solid #073763;
  box-shadow:10px 10px 0 rgba(0,0,0,.35);
}
.cover-text h1{
  font-size:70px;
  margin-bottom:14px;
  color:#073763;
  font-weight:900;
  text-shadow:4px 4px white, 7px 7px #ffcc00;
  letter-spacing:1px;
}
.cover-text h2{
  position:absolute;
  bottom:-520px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  font-size:46px;
  color:#d4145a;
  font-weight:900;
  text-shadow:3px 3px white;
  background:rgba(255,244,184,.92);
  border:7px solid #073763;
  border-radius:24px;
  padding:18px;
}
.title{text-align:center;font-size:38px;color:#7a3f00;margin-bottom:18px;text-shadow:2px 2px white}

/* VOCAB */
.vocab-grid{
  height:75vh;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.word-card{
  background:#f9b233;
  border:6px solid #7a3f00;
  box-shadow:6px 6px 0 #3b2200;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:38px;font-weight:bold;color:white;text-shadow:2px 2px #7a3f00;
  cursor:pointer;padding:10px;
}
.word-card:hover{background:#ffdf59;transform:translateY(-4px)}
.popup{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  align-items:center;justify-content:center;z-index:10;
}
.popup-box{
  width:78%;height:82%;background:#fff4b8;border:8px solid #7a3f00;border-radius:25px;
  padding:25px;text-align:center;box-shadow:10px 10px 0 #3b2200;
}
.popup-box h2{font-size:44px;color:#7a3f00;margin-bottom:10px}
.popup-box img{width:360px;height:280px;object-fit:contain;margin:10px}
.popup-box p{font-size:38px;margin:10px}
.nav-btn{
  padding:12px 25px;margin:10px;border:4px solid #7a3f00;border-radius:12px;
  background:#ffcc00;font-size:20px;font-weight:bold;cursor:pointer;
  touch-action:manipulation;
  user-select:none;
}

/* LESSON */
.lesson-card{
  width:85%;min-height:68vh;margin:auto;background:#fff4b8;border:8px solid #7a3f00;
  border-radius:25px;padding:30px;box-shadow:10px 10px 0 #3b2200;
  display:flex;gap:30px;align-items:center;justify-content:center;
}
.lesson-text{
  flex:1;
  font-family:"Times New Roman",serif;
  font-size:32px;
}
.lesson-text h2{
  font-size:55px;
  text-align:center;
  color:#7a3f00;
  margin-bottom:20px;
  font-family:"Times New Roman",serif;
}
.lesson-text p{
  font-size:32px;
  line-height:1.7;
  font-family:"Times New Roman",serif;
}
.lesson-card img{width:330px;height:330px;object-fit:contain}

/* APPLICATION */
.practice-card{
  width:85%;min-height:70vh;margin:auto;background:#fff4b8;border:8px solid #7a3f00;
  border-radius:25px;padding:25px;text-align:center;box-shadow:10px 10px 0 #3b2200;
}
.practice-card h2{font-size:34px;color:#7a3f00;margin-bottom:10px}
.practice-card img{width:300px;height:230px;object-fit:contain;margin:10px}

.word-bank,.answer-bank{
  min-height:80px;
  border:4px dashed #7a3f00;
  border-radius:15px;
  padding:12px;
  margin:15px auto;
  width:90%;
  background:white;
}

.drag-word{
  display:inline-block;
  background:#ffcc00;
  border:3px solid #7a3f00;
  border-radius:10px;
  padding:10px 15px;
  margin:6px;
  font-size:24px;
  font-weight:bold;
  cursor:grab;
}

.zoom-controls,.number-picker{
  position:fixed;
  left:20px;
  right:auto;
  background:#fff4b8;
  border:5px solid #7a3f00;
  border-radius:15px;
  padding:12px;
  box-shadow:5px 5px 0 #3b2200;
  z-index:9;
}
.zoom-controls{top:430px;width:180px;text-align:center}
.number-picker{top:570px;width:180px;text-align:center;max-height:none;overflow:visible}
.zoom-controls button,.number-picker button,.submit-btn{
  margin:4px;
  padding:10px 14px;
  background:#ffcc00;
  border:3px solid #7a3f00;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.submit-btn{
  font-size:22px;
  margin-top:10px;
}
.feedback{
  font-size:28px;
  font-weight:bold;
  margin-top:15px;
}
.random-number-box{
  width:100px;
  height:100px;
  margin:10px auto;
  background:#ffcc00;
  border:5px solid #7a3f00;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  font-weight:bold;
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
}

/* MAP */
.map-box{
  background:#fff4b8;border:8px solid #7a3f00;border-radius:25px;padding:50px;
  text-align:center;box-shadow:10px 10px 0 #3b2200;
}
.map-box h2{font-size:42px;color:#7a3f00}
.map-box a{
  display:inline-block;margin-top:25px;padding:18px 35px;background:#ffcc00;
  border:4px solid #7a3f00;border-radius:15px;font-size:24px;font-weight:bold;
  color:#000;text-decoration:none;
}
</style>
</head>

<body>
<div class="container">
<div class="sidebar">
<button onclick="showSection('cover')">1. Cover Page</button>
<button onclick="showSection('vocab')">2. Vocabulary Review</button>
<button onclick="showSection('lesson')">3. Lesson Content</button>
<button onclick="showSection('application')">4. Application</button>
<button onclick="showSection('map')">5. Check this out!</button>
</div>

<div class="content">

<div id="cover" class="section active">
  <div class="cover">
    <div class="cover-text">
      <h1>Grade 7- Unit 5 Time Expressions</h1>
      <h2>Prepared by: Teacher Jessy</h2>
    </div>
  </div>
</div>

<div id="vocab" class="section">
  <h1 class="title">Vocabulary Review</h1>
  <div class="vocab-grid" id="vocabGrid"></div>
</div>

<div id="lesson" class="section">
  <h1 class="title">Time Expressions</h1>
  <div class="lesson-card">
    <div class="lesson-text" id="lessonText"></div>
    <img id="lessonImg" alt="time expression image">
  </div>
  <center>
    <button class="nav-btn" onclick="prevLesson()">Previous</button>
    <button class="nav-btn" onclick="nextLesson()">Next</button>
  </center>
</div>

<div id="application" class="section">
  <h1 class="title">Application of Knowledge</h1>

  <div class="zoom-controls">
    <b>Zoom Details</b><br>
    <button onclick="zoomIn()">Zoom +</button>
    <button onclick="zoomOut()">Zoom -</button>
  </div>

  <div class="number-picker" id="numberPicker">
    <b>Number Picker</b><br>
    <div class="random-number-box" onclick="pickRandomNumber()" ontouchstart="pickRandomNumber()">?</div>
  </div>

  <div class="practice-card" id="practiceCard"></div>

  <center>
    <button class="nav-btn" onclick="prevPractice()">Previous</button>
    <button class="nav-btn" onclick="nextPractice()">Next</button>
  </center>
</div>

<div id="map" class="section">
  <h1 class="title">Check this out!</h1>
  <div class="map-box">
    <button class="nav-btn" onclick="openWordwall()" ontouchend="openWordwall()">Wordwall</button>
  </div>
</div>

</div>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h2 id="popTitle"></h2>
    <img id="popImg" alt="vocabulary image">
    <p id="popS1"></p>
    <p id="popS2"></p>
    <button class="nav-btn" onclick="nextVocab()">Next</button>
    <button class="nav-btn" onclick="closePopup()">Close</button>
  </div>
</div>

<script>
function openWordwall(){
  window.open('https://wordwall.net/resource/113307404/g7-unit-5-time-expression','_blank');
}

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

const vocabulary=[
["Beach","noun","beach.png","We went to the beach yesterday.","The beach was clean last summer."],
["Sunset","noun","sunset.png","We watched the sunset yesterday.","The sunset was beautiful last night."],
["Trash","noun","trash.png","We picked up trash yesterday.","They cleaned the trash last weekend."],
["Picnic","noun","picnic.png","We had a picnic last Sunday.","They will have a picnic next week."],
["Surfing","verb","surfing.png","We went surfing last summer.","They will go surfing next weekend."],
["Seashells","noun","seashells.png","She collected seashells yesterday.","We found seashells two days ago."],
["River","noun","river.png","They visited the river yesterday.","We cleaned the river last weekend."],
["Coral Reefs","noun","corals.png","We saw coral reefs last month.","They explored coral reefs a year ago."],
["Island","noun","island.png","We visited the island last summer.","They will go to the island next month."],
["Hill","noun","hill.png","We climbed the hill yesterday.","They visited the hill two days ago."],
["Lake","noun","lake.png","We swam in the lake last weekend.","They visited the lake a week ago."],
["Mountain","noun","mountain.png","We climbed the mountain last year.","They will hike the mountain next month."],
["Waterfalls","noun","waterfalls.png","We visited waterfalls last summer.","They saw waterfalls two days ago."],
["Cave","noun","cave.png","We explored the cave yesterday.","They visited the cave last weekend."]
];

let vocabIndex=0;
const grid=document.getElementById("vocabGrid");

vocabulary.forEach((v,i)=>{
  let card=document.createElement("div");
  card.className="word-card";
  card.innerText=v[0];
  card.onclick=()=>openVocab(i);
  grid.appendChild(card);
});

function openVocab(i){
  vocabIndex=i;
  let v=vocabulary[vocabIndex];
  document.getElementById("popTitle").innerText=`${v[0]} (${v[1]})`;
  document.getElementById("popImg").src=v[2];
  document.getElementById("popS1").innerHTML=v[3];
  document.getElementById("popS2").innerHTML=v[4];
  document.getElementById("popup").style.display="flex";
}
function nextVocab(){openVocab((vocabIndex+1)%vocabulary.length)}
function closePopup(){document.getElementById("popup").style.display="none"}

const lessons=[
{
title:"Time expressions",
img:"time expression.png",
body:`Time expressions tell us when something happens.<br><br>
<b>Example:</b><br>
I went to the beach yesterday.<br>
We will visit the island next month.`
},
{
title:"ago",
img:"ago.png",
body:`ago means before now. We use it to talk about past actions.<br><br>
<b>Example:</b><br>
I visited the beach two days ago.<br>
We cleaned the river a week ago.`
},
{
title:"last",
img:"last.png",
body:`last means the previous time. We use it with night, week, month, year, and weekend.<br><br>
<b>Example:</b><br>
We climbed the mountain last weekend.<br>
She collected seashells last summer.`
},
{
title:"yesterday",
img:"yesterday.png",
body:`yesterday means the day before today. It can refer to morning, afternoon, evening, or night.<br><br>
<b>Example:</b><br>
We had a picnic yesterday.<br>
They visited the lake yesterday.`
},
{
title:"next",
img:"next.png",
body:`next means a future time. We use it for plans.<br><br>
<b>Example:</b><br>
We will visit the island next month.<br>
They will go surfing next weekend.`
}
];

let lessonIndex=0;
function showLesson(){
  let l=lessons[lessonIndex];
  document.getElementById("lessonText").innerHTML=`<h2>${l.title}</h2><p>${l.body}</p>`;
  document.getElementById("lessonImg").src=l.img;
}
function nextLesson(){lessonIndex=(lessonIndex+1)%lessons.length;showLesson()}
function prevLesson(){lessonIndex=(lessonIndex-1+lessons.length)%lessons.length;showLesson()}
showLesson();

const practice=[
["beach.png","yesterday",["We","visited","the","beach","yesterday"],"We visited the beach yesterday"],
["mountain.png","last weekend",["They","climbed","the","mountain","last weekend"],"They climbed the mountain last weekend"],
["island.png","next month",["We","will","visit","the","island","next month"],"We will visit the island next month"],
["river.png","two days ago",["We","cleaned","the","river","two days ago"],"We cleaned the river two days ago"],
["surfing.png","last summer",["They","went","surfing","last summer"],"They went surfing last summer"],
["picnic.png","yesterday",["We","had","a","picnic","yesterday"],"We had a picnic yesterday"],
["lake.png","a week ago",["They","visited","the","lake","a week ago"],"They visited the lake a week ago"],
["waterfalls.png","last year",["We","saw","waterfalls","last year"],"We saw waterfalls last year"],
["cave.png","yesterday",["They","explored","the","cave","yesterday"],"They explored the cave yesterday"],
["hill.png","next weekend",["We","will","climb","the","hill","next weekend"],"We will climb the hill next weekend"],
["sunset.png","last night",["We","watched","the","sunset","last night"],"We watched the sunset last night"],
["trash.png","yesterday",["They","picked up","trash","yesterday"],"They picked up trash yesterday"],
["seashells.png","two days ago",["She","found","seashells","two days ago"],"She found seashells two days ago"],
["coralreefs.png","last month",["They","explored","coral reefs","last month"],"They explored coral reefs last month"],
["island.png","next summer",["We","will","go","to","the","island","next summer"],"We will go to the island next summer"]
];

let practiceIndex=-1;
let zoomSize=1;

function playCorrectSound(){
  const audio=new Audio("correct.mp3");
  audio.play().catch(()=>{});
}

function playWrongSound(){
  const audio=new Audio("buzz.mp3");
  audio.play().catch(()=>{});
}

function shuffleArray(arr){
  return [...arr].sort(()=>Math.random()-0.5);
}

function showPractice(){
  const card=document.getElementById("practiceCard");

  if(practiceIndex===-1){
    card.innerHTML=`
      <h2 style="font-size:48px;">Try this out!</h2>
      <p style="font-size:28px;">Click Next to start the activity.</p>
    `;
    return;
  }

  let p=practice[practiceIndex];
  let shuffled=shuffleArray(p[2]);

  card.innerHTML=`
    <h2>Question ${practiceIndex+1} of 15</h2>
    <h2>Time Expression: ${p[1]}</h2>
    <img src="${p[0]}" alt="question image">
    <p style="font-size:24px;">Drag the words in order to make a sentence.</p>

    <div class="word-bank" id="wordBank">
      ${shuffled.map(w=>`<span class="drag-word" draggable="true">${w}</span>`).join("")}
    </div>

    <h2>Answer:</h2>
    <div class="answer-bank" id="answerBank"></div>

    <button class="submit-btn" onclick="checkAnswer()">Submit</button>
    <button class="submit-btn" onclick="showPractice()">Reset</button>
    <div class="feedback" id="feedback"></div>
  `;

  enableDrag();
  applyZoom();
}

function enableDrag(){
  document.querySelectorAll(".drag-word").forEach(word=>{
    word.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",e.target.innerText);
      e.target.classList.add("dragging");
    });
    word.addEventListener("dragend",e=>{
      e.target.classList.remove("dragging");
    });

    word.addEventListener("click",()=>{
      const answerBank=document.getElementById("answerBank");
      const wordBank=document.getElementById("wordBank");
      if(word.parentElement.id==="wordBank"){
        answerBank.appendChild(word);
      }else{
        wordBank.appendChild(word);
      }
    });

    word.addEventListener("touchend",e=>{
      e.preventDefault();
      const answerBank=document.getElementById("answerBank");
      const wordBank=document.getElementById("wordBank");
      if(word.parentElement.id==="wordBank"){
        answerBank.appendChild(word);
      }else{
        wordBank.appendChild(word);
      }
    },{passive:false});
  });

  document.querySelectorAll(".word-bank,.answer-bank").forEach(box=>{
    box.addEventListener("dragover",e=>e.preventDefault());
    box.addEventListener("drop",e=>{
      e.preventDefault();
      const dragging=document.querySelector(".dragging");
      if(dragging) box.appendChild(dragging);
    });
  });
}

function checkAnswer(){
  if(practiceIndex<0) return;

  let answer=[...document.querySelectorAll("#answerBank .drag-word")]
    .map(w=>w.innerText).join(" ");

  let correct=practice[practiceIndex][3];

  if(answer===correct){
    document.getElementById("feedback").innerText="Correct!";
    document.getElementById("feedback").style.color="green";
    playCorrectSound();
  }else{
    document.getElementById("feedback").innerText="Try again!";
    document.getElementById("feedback").style.color="red";
    playWrongSound();
  }
}

function nextPractice(){
  if(practiceIndex<practice.length-1){
    practiceIndex++;
    showPractice();
  }
}

function prevPractice(){
  if(practiceIndex>-1){
    practiceIndex--;
    showPractice();
  }
}

function buildNumberPicker(){
  const box=document.querySelector(".random-number-box");
  if(box) box.innerText="?";
}

function pickRandomNumber(play=true){
  const box=document.querySelector(".random-number-box");
  if(!box) return;
  const randomNum=Math.floor(Math.random()*31)+1;
  box.innerText=randomNum;
  if(play){
    box.style.transform="scale(1.12)";
    setTimeout(()=>box.style.transform="scale(1)",150);
  }
}

function zoomIn(){
  zoomSize+=0.1;
  applyZoom();
}

function zoomOut(){
  zoomSize=Math.max(0.7,zoomSize-0.1);
  applyZoom();
}

function applyZoom(){
  const card=document.getElementById("practiceCard");
  if(card){
    card.style.transform=`scale(${zoomSize})`;
    card.style.transformOrigin="top center";
  }
}

buildNumberPicker();
showPractice();
</script>
</body>
</html>
